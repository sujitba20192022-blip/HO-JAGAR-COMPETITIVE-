<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Dashboard - HO JAGAR COMPETITIVE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f5;
      color: #17221c;
    }

    .top {
      background: linear-gradient(135deg, #087443, #0b9b58);
      color: white;
      padding: 20px;
    }

    .top h1 {
      font-size: 23px;
    }

    .top p {
      margin-top: 6px;
    }

    .container {
      max-width: 1000px;
      margin: auto;
      padding: 18px;
    }

    .profile {
      background: white;
      padding: 20px;
      border-radius: 18px;
      margin-bottom: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.07);
    }

    .profile h2 {
      color: #087443;
      margin-bottom: 7px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 22px;
    }

    .stat {
      background: white;
      padding: 18px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .stat strong {
      display: block;
      font-size: 25px;
      color: #087443;
      margin-bottom: 5px;
    }

    .section-title {
      margin: 20px 0 12px;
    }

    .tests {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
       }

    .test {
      background: white;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    .test h3 {
      color: #087443;
      margin-bottom: 8px;
    }

    .test p {
      margin: 5px 0;
      color: #555;
    }

    button {
      width: 100%;
      border: none;
      padding: 12px;
      margin-top: 12px;
      border-radius: 10px;
      background: #087443;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .paid {
      background: #e63946;
    }

    .nav {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 25px;
    }

    .nav button {
      margin: 0;
      background: white;
      color: #087443;
      border: 1px solid #ddd;
    }

    @media (max-width: 700px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .tests {
        grid-template-columns: 1fr;
      }

      .nav {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

<header class="top">
  <h1>HO JAGAR COMPETITIVE</h1>
  <p>Student Dashboard</p>
</header>

<main class="container">

<section class="profile">
  <h2>👋 Welcome, Student</h2>
  <p>आपके सभी tests और results यहाँ दिखाई देंगे।</p>
</section>

<section class="stats">
  <div class="stat"><strong>0</strong>Tests</div>
  <div class="stat"><strong>0</strong>Completed</div>
  <div class="stat"><strong>0</strong>Score</div>
  <div class="stat"><strong>--</strong>Rank</div>
<section class="tests" id="testsContainer">
  <p>Tests loading...</p>
</section>

<h2 class="section-title">📊 My Activity</h2>

<section class="nav">

  <button onclick="openPage('tests')">Tests</button>

  <button onclick="openPage('mytests')">My Tests</button>

  <!-- ⭐ RESULTS BUTTON -->
  <button onclick="window.location.href='result.html'">
    Results
  </button>

  <button onclick="openPage('payments')">Payments</button>

  <button onclick="openPage('profile')">Profile</button>

</section>

</main>

<script>

function loadPublishedTests() {
  const tests = JSON.parse(localStorage.getItem("hoJagarTests")) || [];
  const container = document.getElementById("testsContainer");

  const publishedTests = tests.filter(test => test.status === "Published");

  if (publishedTests.length === 0) {
    container.innerHTML = `
      <p style="background:white;padding:20px;border-radius:15px;">
        अभी कोई Published Test उपलब्ध नहीं है।
      </p>
    `;
    return;
  }

  container.innerHTML = "";

  publishedTests.forEach(test => {
    const card = document.createElement("div");
    card.className = "test";

    card.innerHTML = `
      <h3>${test.name}</h3>
      <p>📝 Questions: ${test.totalQuestions}</p>
      <p>⏱️ Duration: ${test.duration} Minutes</p>
      <p>💰 ${test.type === "Paid" ? "Paid Test" : "Free Test"}</p>

      <button
        class="${test.type === "Paid" ? "paid" : ""}"
        onclick="startTest('${test.name}')">
        ${test.type === "Paid" ? "Buy Test" : "Start Test"}
      </button>
    `;

    container.appendChild(card);
  });
}

function startTest(testName) {
  localStorage.setItem("selectedTestName", testName);
  window.location.href = "test.html";
}

function buyTest(testName) {
  alert("Payment system जल्द ही connect किया जाएगा।");
  }

function openPage(page) {
  alert(page + " section जल्द ही connect किया जाएगा।");
}
loadPublishedTests();
</script>

</body>
</html>
