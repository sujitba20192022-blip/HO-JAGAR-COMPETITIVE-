<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Test - HO JAGAR COMPETITIVE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f5;
      color: #17221c;
    }

    .header {
      background: linear-gradient(135deg, #087443, #0b9b58);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h2 {
      color: #087443;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #087443;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .clear {
      background: #777;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #e8f5ed;
      color: #087443;
    }
  </style>
</head>

<body>

<header class="header">
  <h1>HO JAGAR COMPETITIVE</h1>
  <p id="pageTitle">Create New Test</p>
</header>

<main class="container">

<section class="box">

  <h2 id="formTitle">📝 Create Test</h2>

  <label>Test Name</label>
  <input id="testName" type="text"
    placeholder="जैसे: Jharkhand GK Test">

  <label>Test Description</label>
  <textarea id="description"
    placeholder="Test के बारे में जानकारी"></textarea>

  <label>Total Questions</label>
  <input id="totalQuestions" type="number"
    min="1" max="100" value="100">

  <label>Duration (Minutes)</label>
  <input id="duration" type="number"
    min="1" value="60">

  <label>Marks Per Question</label>
  <input id="marks" type="number"
    min="0" value="1">

  <label>Negative Marking</label>
  <input id="negative" type="number"
    min="0" step="0.25" value="0">

  <label>Test Type</label>
  <select id="testType" onchange="showPrice()">
    <option value="free">Free Test</option>
    <option value="paid">Paid Test</option>
  </select>

  <div id="priceBox" style="display:none;">

    <label>Test Price (₹)</label>
    <input id="price" type="number"
      min="1" placeholder="जैसे: 49">

  </div>

  <label>Test Status</label>

  <select id="status">
    <option value="draft">Draft</option>
    <option value="published">Published</option>
  </select>

  <button id="saveButton" onclick="saveTest()">
    Save Test
  </button>

  <button class="clear" onclick="resetForm()">
    Clear
  </button>

  <div id="message" class="message"></div>

</section>

</main>

<script>

let editIndex = -1;


function showPrice() {

  const type =
    document.getElementById("testType").value;

  document.getElementById("priceBox").style.display =
    type === "paid" ? "block" : "none";
}


function saveTest() {

  const name =
    document.getElementById("testName").value.trim();

  const description =
    document.getElementById("description").value.trim();

  const totalQuestions =
    Number(document.getElementById("totalQuestions").value);

  const duration =
    Number(document.getElementById("duration").value);

  const marks =
    Number(document.getElementById("marks").value);

  const negative =
    Number(document.getElementById("negative").value);

  const type =
    document.getElementById("testType").value;

  const price =
    Number(document.getElementById("price").value || 0);

  const status =
    document.getElementById("status").value;


  if (!name) {
    showMessage("कृपया Test Name भरें।");
    return;
  }

  if (totalQuestions < 1 || totalQuestions > 100) {
    showMessage("Questions 1 से 100 के बीच होने चाहिए।");
    return;
  }

  if (duration < 1) {
    showMessage("Duration सही डालें।");
    return;
  }

  if (type === "paid" && price <= 0) {
    showMessage("Paid Test के लिए Price डालें।");
    return;
  }


  let tests =
    JSON.parse(localStorage.getItem("hoJagarTests")) || [];


  const testData = {

    id: editIndex === -1
      ? Date.now()
      : tests[editIndex].id,

    name: name,

    description: description,

    totalQuestions: totalQuestions,

    duration: duration,

    marks: marks,

    negative: negative,

    type: type,

    price: price,

    status: status

  };


  if (editIndex === -1) {

    tests.push(testData);

    showMessage("Test successfully save हो गया।");

  } else {

    tests[editIndex] = testData;

    showMessage("Test successfully update हो गया।");

    editIndex = -1;

    document.getElementById("formTitle").innerText =
      "📝 Create Test";

    document.getElementById("pageTitle").innerText =
      "Create New Test";

    document.getElementById("saveButton").innerText =
      "Save Test";
  }


  localStorage.setItem(
    "hoJagarTests",
    JSON.stringify(tests)
  );

  localStorage.removeItem("editTest");
}


function loadEditTest() {

  const editData =
    JSON.parse(localStorage.getItem("editTest"));

  if (!editData) return;

  editIndex = editData.index;

  const test = editData.data;


  document.getElementById("formTitle").innerText =
    "✏️ Edit Test";

  document.getElementById("pageTitle").innerText =
    "Edit Test";

  document.getElementById("saveButton").innerText =
    "Update Test";


  document.getElementById("testName").value =
    test.name;

  document.getElementById("description").value =
    test.description || "";

  document.getElementById("totalQuestions").value =
    test.totalQuestions;

  document.getElementById("duration").value =
    test.duration;

  document.getElementById("marks").value =
    test.marks;

  document.getElementById("negative").value =
    test.negative;

  document.getElementById("testType").value =
    test.type;

  document.getElementById("price").value =
    test.price || 0;

  document.getElementById("status").value =
    test.status;

  showPrice();
}


function resetForm() {

  document.getElementById("testName").value = "";
  document.getElementById("description").value = "";
  document.getElementById("totalQuestions").value = 100;
  document.getElementById("duration").value = 60;
  document.getElementById("marks").value = 1;
  document.getElementById("negative").value = 0;
  document.getElementById("testType").value = "free";
  document.getElementById("price").value = "";
  document.getElementById("status").value = "draft";

  showPrice();
}


function showMessage(text) {

  const message =
    document.getElementById("message");

  message.innerText = text;
  message.style.display = "block";
}


loadEditTest();

</script>

</body>
</html>
