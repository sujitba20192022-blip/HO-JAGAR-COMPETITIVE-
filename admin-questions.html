<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Questions - HO JAGAR COMPETITIVE</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7f5;
      color: #17221c;
    }

    .header {
      background: linear-gradient(135deg, #087443, #0b9b58);
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
    }

    h2 {
      color: #087443;
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .option {
      margin-top: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 20px;
      border: none;
      border-radius: 10px;
      background: #087443;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .reset {
      background: #777;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #e8f5ed;
      color: #087443;
      display: none;
    }
  </style>
</head>

<body>

  <header class="header">
    <h1>HO JAGAR COMPETITIVE</h1>
    <p>Admin Question Management</p>
  </header>

  <main class="container">

    <section class="box">

      <h2>➕ Add New Question</h2>

      <label>Question</label>
      <textarea id="question"
        placeholder="अपना question यहाँ लिखें"></textarea>

      <label>Option A</label>
      <input id="optionA" type="text" placeholder="Option A">

      <label>Option B</label>
      <input id="optionB" type="text" placeholder="Option B">

      <label>Option C</label>
      <input id="optionC" type="text" placeholder="Option C">

      <label>Option D</label>
      <input id="optionD" type="text" placeholder="Option D">

      <label>Correct Answer</label>
      <select id="correctAnswer">
        <option value="">सही answer चुनें</option>
        <option value="0">Option A</option>
        <option value="1">Option B</option>
        <option value="2">Option C</option>
        <option value="3">Option D</option>
      </select>

      <label>Marks</label>
      <input id="marks" type="number" value="1" min="0">

      <label>Negative Marking</label>
      <input id="negative" type="number" value="0" min="0" step="0.25">

      <button onclick="saveQuestion()">
        Save Question
      </button>

      <button class="reset" onclick="resetForm()">
        Clear
      </button>

      <div id="message" class="message"></div>

    </section>

  </main>

  <script>

    function saveQuestion() {

      const question = document.getElementById("question").value.trim();
      const optionA = document.getElementById("optionA").value.trim();
      const optionB = document.getElementById("optionB").value.trim();
      const optionC = document.getElementById("optionC").value.trim();
      const optionD = document.getElementById("optionD").value.trim();
      const correctAnswer = document.getElementById("correctAnswer").value;
      const marks = document.getElementById("marks").value;
      const negative = document.getElementById("negative").value;

      if (
        !question ||
        !optionA ||
        !optionB ||
        !optionC ||
        !optionD ||
        correctAnswer === ""
      ) {
        showMessage("कृपया सभी जानकारी भरें।");
        return;
      }

      const questionData = {
        question: question,
        options: [
          optionA,
          optionB,
          optionC,
          optionD
        ],
        answer: Number(correctAnswer),
        marks: Number(marks),
        negative: Number(negative)
      };

      let savedQuestions =
        JSON.parse(localStorage.getItem("hoJagarQuestions")) || [];

      savedQuestions.push(questionData);

      localStorage.setItem(
        "hoJagarQuestions",
        JSON.stringify(savedQuestions)
      );

      showMessage(
        "Question successfully save हो गया। Total Questions: " +
        savedQuestions.length
      );

      resetForm();
    }

    function resetForm() {
      document.getElementById("question").value = "";
      document.getElementById("optionA").value = "";
      document.getElementById("optionB").value = "";
      document.getElementById("optionC").value = "";
      document.getElementById("optionD").value = "";
      document.getElementById("correctAnswer").value = "";
      document.getElementById("marks").value = 1;
      document.getElementById("negative").value = 0;
    }

    function showMessage(text) {
      const message = document.getElementById("message");

      message.innerText = text;
      message.style.display = "block";
    }

  </script>

</body>
          </html>
